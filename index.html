<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon/IMG-20250501-WA0056.jpg" type="image/x-icon">
    <title>Inicio de sesion | Schoolaret</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="header">
    <img src="imagenes/logo/IMG-20250501-WA0056.jpg"
         alt="Icono" id="logo">

    <a href="explicon/explicon.html">
        <img src="imagenes/logo/253950-removebg-preview.png"
         alt="Logo Schoolaret"
         height="100px"
         width="auto"
         id="logo2">
        </a>
</header>
    <div id="formlogin">
        <form id="login">
            <label for="user">Usuario</label>
            <br>
            <input type="text" id="user" placeholder="ingrese su usuario" required>
            <br>
            <label for="password">Contraseña</label>
            <br>
            <input type="password" id="password" placeholder="ingrese su contraseña" required>
            <br>
            <label for="rol">Rol</label>
            <br>
            <select name="Rol" id="rol" required>
                <option value="">Seleccione un rol</option>
                <option value="estudiante">Estudiante</option>
                <option value="profesor">Profesor</option>
                <option value="administrador">Administrador</option>
            </select>
        </form>
        <button id="enviar">Enviar</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
<footer>

    </p>
    </div>
</footer>
</html>
