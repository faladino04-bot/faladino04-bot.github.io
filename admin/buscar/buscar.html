<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../favicon/IMG-20250501-WA0056.jpg" type="image/x-icon">
    <title>Schoolaret - Buscar y Modificar Usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <img src="../../imagenes/logo/IMG-20250501-WA0056.jpg" alt="" width="100px" height="100px" id="logo">

        <a href="../../explicon/explicon.html">
        <img src="../../imagenes/logo/253950-removebg-preview.png"
         alt="Logo Schoolaret"
         height="100px"
         width="auto"
         id="logo2">
        </a>
    </header>

    <div id="menu_opciones">
        <div id="menu_lado" class="oculto">
            <div class="menu" id="mhome">
                <img class="icono" src="../../imagenes/iconos/hogar.png" alt="" id="home">
                <p id="texto_home" class="oculto">hogar</p>
            </div>
            <div class="menu" id="magregar_usuario">
                <img class="icono" src="../../imagenes/iconos/agregar.png" alt="" id="agregar_usuario">
                <p id="texto_agregar" class="oculto">agregar usuario</p>
            </div>
            <div class="menu" id="mcrear">
                <img class="icono" src="../../imagenes/iconos/ajuste.png" alt="" id="crear">
                <p id="texto_crear" class="oculto">crear curso/asignatura/anuncio</p>
            </div>
            <div class="menu" id="mborrar_usuario">
                <img class="icono" src="../../imagenes/iconos/borrar.png" alt="" id="borrar_usuario">
                <p id="texto_borrar" class="oculto">borrar usuario</p>
            </div>
            <div class="menu" id="mbuscar_usuario">
                <img class="icono" src="../../imagenes/iconos/buscar.png" alt="" id="buscar_usuario">
                <p id="texto_buscar" class="oculto">buscar usuario</p>
            </div>
            <div class="menu" id="mcerrar">
                <img class="icono" src="../../imagenes/iconos/cerrar-sesion.png" alt="" id="cerrar">
                <p id="texto_cerrar" class="oculto">cerrar sesion</p>
            </div>
        </div>

        <main id="contenido">
            <div class="search-card">
                <h2>Buscar y Gestionar Usuarios</h2>
                
                <!-- Formulario de Búsqueda -->
                <form id="form-buscar">
                    <div class="form-group">
                        <label for="buscar_nombre">Nombre o Usuario:</label>
                        <input type="text" id="buscar_nombre" placeholder="Escribe para buscar...">
                    </div>
                    
                    <div class="form-group">
                        <label for="buscar_rol">Rol:</label>
                        <select id="buscar_rol">
                            <option value="">Todos los roles</option>
                            <option value="Estudiante">Estudiante</option>
                            <option value="Profesor">Profesor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>

                    <!-- 1. Campo de Grado en el Formulario de Búsqueda -->
                    <div class="form-group" id="contenedor_grado_buscar" style="display: none;">
                        <label for="buscar_grado">Grado:</label>
                        <select id="buscar_grado">
                            <option value="">Todos los grados</option>
                        </select>
                    </div>

                    <button type="button" id="btn-ejecutar-busqueda">Buscar en el sistema</button>
                </form>

                <!-- Resultados de búsqueda -->
                <div id="resultados_busqueda" style="margin-top: 20px;">
                    <h3>Resultados:</h3>
                    <ul id="lista_usuarios" style="list-style: none; padding: 0; margin-top: 10px;">
                        <!-- Aquí se renderizarán los usuarios dinámicamente -->
                    </ul>
                </div>

                <!-- SECCIÓN DE ACCIONES (Aparece al seleccionar un usuario) -->
                <div id="seccion_acciones_usuario" style="display: none; margin-top: 20px; border-top: 2px solid #037EF5; padding-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                    
                    <!-- Botones de Acción -->
                    <div style="display: flex; gap: 10px;">
                        <button type="button" id="btn_mostrar_caja_mensaje" style="flex: 1; background-color: #037EF5; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;">Enviar aviso</button>
                        <button type="button" id="btn_mostrar_modificar" style="flex: 1; background-color: #e67e22; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;">Ver / Modificar Datos</button>
                    </div>
                    
                    <!-- Caja para escribir el aviso -->
                    <div id="caja_mensaje" style="display: none; margin-top: 10px; flex-direction: column; gap: 10px; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                        <h4>Enviar mensaje o aviso</h4>
                        <textarea id="texto_aviso" rows="3" placeholder="Escribe tu aviso aquí..." style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
                        
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <label style="font-size: 0.9rem; color: #555;">Adjuntar archivo (opcional):</label>
                            <input type="file" id="archivo_aviso">
                        </div>

                        <button type="button" id="btn_enviar_aviso" style="background-color: #27ae60; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold;">Enviar Aviso</button>
                    </div>

                    <!-- Formulario de Modificar Datos (Aparece al hacer clic en Ver/Modificar) -->
                    <div id="caja_modificar" style="display: none; margin-top: 10px; flex-direction: column; gap: 10px; background: #fff; padding: 15px; border-radius: 6px; border: 1px solid #ddd;">
                        <h4 style="color: #004985; margin-bottom: 5px;">Modificar Información de Usuario</h4>
                        
                        <div class="form-group" style="margin-bottom: 8px;">
                            <label style="font-size: 0.85rem;">Usuario (No modificable):</label>
                            <input type="text" id="mod_usuario" style="padding: 8px; background-color: #f1f3f5;" disabled>
                        </div>
                        <div class="form-group" style="margin-bottom: 8px;">
                            <label style="font-size: 0.85rem;">Nombre:</label>
                            <input type="text" id="mod_nombre" style="padding: 8px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 8px;">
                            <label style="font-size: 0.85rem;">Rol:</label>
                            <select id="mod_rol" style="padding: 8px;">
                                <option value="estudiante">Estudiante</option>
                                <option value="profesor">Profesor</option>
                                <option value="administrador">Administrador</option>
                            </select>
                        </div>
                        <!-- 2. Campo de Grado en la Caja de Modificación -->
                        <div class="form-group" id="mod_contenedor_grado" style="display: none; margin-bottom: 8px;">
                            <label style="font-size: 0.85rem;">Grado:</label>
                            <select id="mod_grado" style="padding: 8px;">
                                <option value="">Seleccione un grado</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label style="font-size: 0.85rem;">Nueva Contraseña (dejar en blanco para no cambiar):</label>
                            <input type="password" id="mod_password" style="padding: 8px;" placeholder="Nueva contraseña">
                        </div>

                        <button type="button" id="btn_guardar_cambios" style="background-color: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;">Guardar Cambios</button>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../usuarios-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
