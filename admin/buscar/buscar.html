<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../favicon/IMG-20250501-WA0056.jpg" type="image/x-icon">
    <title>Schoolaret - Buscar Usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <img src="../../imagenes/logo/IMG-20250501-WA0056.jpg" alt="" width="100px" height="100px" id="logo">
        <img src="../../imagenes/logo/253950-removebg-preview.png" alt="" height="100px" width=auto id="logo2">
    </header>

    <div id="menu_opciones">
        <div id="menu_lado" class="oculto">
            <div class="menu" id="mhome">
                <img class="icono" src="../../imagenes/iconos/hogar.png" alt="" id="home">
                <p id="texto_home" class="oculto">hogar</p>
            </div>
            <div class="menu" id="magregar_usuario">
                <img class="icono" src="../../imagenes/iconos/agregar.png" alt="" id="agregar_usuario">
                <p id="texto_agregar" class="oculto">agregar usuario</p>
            </div>
            <div class="menu" id="mborrar_usuario">
                <img class="icono" src="../../imagenes/iconos/borrar.png" alt="" id="borrar_usuario">
                <p id="texto_borrar" class="oculto">borrar usuario</p>
            </div>
            <div class="menu" id="mbuscar_usuario">
                <img class="icono" src="../../imagenes/iconos/buscar.png" alt="" id="buscar_usuario">
                <p id="texto_buscar" class="oculto">buscar usuario</p>
            </div>
        </div>

        <main id="contenido">
            <div class="search-card">
                <h2>Buscar Usuarios</h2>
                
                <!-- Formulario de Búsqueda -->
                <form id="form-buscar">
                    <div class="form-group">
                        <label for="buscar_nombre">Nombre o Usuario:</label>
                        <input type="text" id="buscar_nombre" placeholder="Escribe para buscar...">
                    </div>
                    
                    <div class="form-group">
                        <label for="buscar_rol">Rol:</label>
                        <select id="buscar_rol">
                            <option value="">Todos los roles</option>
                            <option value="Estudiante">Estudiante</option>
                            <option value="Profesor">Profesor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>

                    <!-- Campo de Grado (Oculto por defecto, solo se muestra si es Estudiante) -->
                    <div class="form-group" id="contenedor_grado_buscar" style="display: none;">
                        <label for="buscar_grado">Grado:</label>
                        <input type="text" id="buscar_grado" placeholder="Ej: 10°">
                    </div>

                    <button type="button" id="btn-buscar">Buscar</button>
                </form>

                <!-- Resultados de búsqueda simulados -->
                <div id="resultados_busqueda" style="margin-top: 20px;">
                    <h3>Resultados:</h3>
                    <ul id="lista_usuarios" style="list-style: none; padding: 0; margin-top: 10px;">
                        <!-- Ejemplo visual de usuario estático para probar la interfaz
                        <li class="user-item" style="padding: 8px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between;">
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" class="seleccionar-usuario" data-nombre="Juan Pérez">
                                <span>Juan Pérez (Estudiante - 10°)</span>
                            </label>
                        </li>
                        -->
                    </ul>
                </div>

                <!-- Sección para enviar mensaje (Aparece al seleccionar usuario) -->
                <div id="seccion_mensaje" style="display: none; margin-top: 20px; border-top: 2px solid #037EF5; padding-top: 15px;">
                    <button type="button" id="btn_mostrar_caja_mensaje" style="background-color: #037EF5; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Enviar mensaje / aviso</button>
                    
                    <!-- Caja para escribir el aviso -->
                    <div id="caja_mensaje" style="display: none; margin-top: 10px; display: flex; flex-direction: column; gap: 10px;">
                        <textarea id="texto_aviso" rows="4" placeholder="Escribe tu aviso aquí..." style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
                        
                        <!-- Archivo adjunto opcional -->
                        <div style="display: flex; flex-direction: column; gap: 5px;">
                            <label style="font-size: 0.9rem; color: #555;">Adjuntar archivo (opcional):</label>
                            <input type="file" id="archivo_aviso">
                        </div>

                        <button type="button" id="btn_enviar_aviso" style="background-color: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;">Enviar Aviso</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
