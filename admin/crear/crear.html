<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../favicon/IMG-20250501-WA0056.jpg" type="image/x-icon">
    <title>Schoolaret</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <img src="../../imagenes/logo/IMG-20250501-WA0056.jpg" alt="" width="100px" height="100px" id="logo">

        <a href="../../explicon/explicon.html">
        <img src="../../imagenes/logo/253950-removebg-preview.png"
         alt="Logo Schoolaret"
         height="100px"
         width="auto"
         id="logo2">
        </a>
    </header>

    <div id="menu_opciones">
        <div id="menu_lado" class="oculto">
            <div class="menu" id="mhome">
                <img class="icono" src="../../imagenes/iconos/hogar.png" alt="" id="home">
                <p id="texto_home" class="oculto">hogar</p>
            </div>
            <div class="menu" id="magregar_usuario">
                <img class="icono" src="../../imagenes/iconos/agregar.png" alt="" id="agregar_usuario">
                <p id="texto_agregar" class="oculto">agregar usuario</p>
            </div>
            <div class="menu" id="mcrear">
                <img class="icono" src="../../imagenes/iconos/ajuste.png" alt="" id="crear">
                <p id="texto_crear" class="oculto">crear curso/asignatura/anuncio</p>
            </div>
            <div class="menu" id="mborrar_usuario">
                <img class="icono" src="../../imagenes/iconos/borrar.png" alt="" id="borrar_usuario">
                <p id="texto_borrar" class="oculto">borrar usuario</p>
            </div>
            <div class="menu" id="mbuscar_usuario">
                <img class="icono" src="../../imagenes/iconos/buscar.png" alt="" id="buscar_usuario">
                <p id="texto_buscar" class="oculto">buscar usuario</p>
            </div>
            <div class="menu" id="mcerrar">
                <img class="icono" src="../../imagenes/iconos/cerrar-sesion.png" alt="" id="cerrar">
                <p id="texto_cerrar" class="oculto">cerrar sesion</p>
            </div>
        </div>

            <main id="contenido">
                <div class="contenedor-creacion">
                    <h2>Panel de Creación Administrativa</h2>
                    
                    <div class="grid-recuadros">
                        <!-- Recuadro 1: Crear Grado -->
                        <div class="recuadro-card">
                            <h3>Crear Grado / Curso</h3>
                            <form id="form-grado">
                                <div class="grupo-input">
                                    <label for="nombre_grado">Nombre del Grado (ej. 10° o Decimo):</label>
                                    <input type="text" id="nombre_grado" required placeholder="Ej. 10°">
                                </div>
                                <button type="submit" class="btn-accion">Guardar Grado</button>
                            </form>
                        </div>

                        <!-- Recuadro 2: Crear Asignatura -->
                        <div class="recuadro-card">
                            <h3>Crear Asignatura</h3>
                            <form id="form-asignatura">
                                <div class="grupo-input">
                                    <label for="nombre_asignatura">Nombre de la Asignatura:</label>
                                    <input type="text" id="nombre_asignatura" required placeholder="Ej. Matemáticas">
                                </div>
                                <div class="grupo-input">
                                    <label for="select_grado">Seleccionar Grado:</label>
                                    <select id="select_grado" required>
                                        <option value="">Cargando grados...</option>
                                    </select>
                                </div>
                                <div class="grupo-input">
                                    <label for="select_profesor">Seleccionar Profesor:</label>
                                    <select id="select_profesor" required>
                                        <option value="">Cargando profesores...</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn-accion">Guardar Asignatura</button>
                            </form>
                        </div>

                        <!-- Recuadro 3: Crear Anuncio General -->
                        <div class="recuadro-card">
                            <h3>Crear Anuncio General</h3>
                            <form id="form-anuncio">
                                <div class="grupo-input">
                                    <label for="titulo_anuncio">Título del Anuncio:</label>
                                    <input type="text" id="titulo_anuncio" required placeholder="Ej. Inicio de semana cultural">
                                </div>
                                <div class="grupo-input">
                                    <label for="contenido_anuncio">Contenido:</label>
                                    <textarea id="contenido_anuncio" rows="4" required placeholder="Escribe los detalles del anuncio aquí..."></textarea>
                                </div>
                                <button type="submit" class="btn-accion">Publicar Anuncio</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
